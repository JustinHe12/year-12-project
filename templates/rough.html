{%extends "layout.html"%}
{% block body %}
    <div class = "three-column">

      {% for result in results %}
        <a href="{{ url_for('question', id=result[1]) }}">
        <div class="w3-card-4">
            <h1>Source: {{ result[1] }}</h1> 
            
            <img src="{{ url_for('static', filename=result[1]) }}" alt="result[1]">
                 
        </div>
    </a>
{% endfor %}

    </div> 
{% endblock %}
